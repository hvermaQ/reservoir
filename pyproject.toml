[project]
name = "qrc"
version = "0.1.0"
description = "Quantum reservoir computing benchmarks with controlled classical baselines"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "openpyxl",
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["qrc*"]
